# Settings for the 'dev' profile, overrides application.yml

server:
  port: 8081 # Running on a different port to avoid conflicts

spring:
  # --- PostgreSQL Database Configuration for Development ---
  datasource:
    url: jdbc:postgresql://localhost:5432/safeworkdb_dev
    username: safework_dev_user
    password: ${DB_DEV_PASSWORD} # Use an environment variable for the password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      # Use 'update' to automatically update schema based on entities
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # Makes the logged SQL more readable
        # Enable JSONB support for PostgreSQL
        jdbc:
          time_zone: UTC

  # --- Disable Flyway for development (using Hibernate DDL) ---
  flyway:
    enabled: false
    baseline-on-migrate: true

# --- Enhanced Logging for Debugging ---
logging:
  level:
    # Shows Hibernate's parameter binding in logs
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: debug